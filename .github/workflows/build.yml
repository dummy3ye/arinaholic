name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Next.js
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build site
        run: bun run build

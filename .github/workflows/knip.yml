name: Knip

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  knip:
    name: Knip
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Find unused code
        run: bun run knip
